<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doo'h CMS — 페이지를 찾을 수 없습니다" />
    <title>404 | Doo'h CMS</title>
    <link rel="stylesheet" href="./src/styles/main.scss" />
    <link rel="stylesheet" href="./src/styles/pages/error.scss" />
    <script type="module" src="./src/js/pages/error.js"></script>
  </head>
  <body>
    <main class="error-page">
      <div class="error-page__bg" aria-hidden="true">
        <img class="error-page__bg-img" src="{{base}}assets/images/media-bg.png" alt="" />
        <div class="error-page__bg-fade"></div>
      </div>

      <div class="error-page__content">
        <img
          class="error-page__illust"
          src="{{base}}assets/images/error-404.svg"
          alt=""
          width="320"
          height="200"
        />

        <div class="error-page__copy">
          <h1 class="error-page__title">
            죄송합니다.<br />
            요청하신 페이지를 찾을 수 없습니다.
          </h1>
          <p class="error-page__desc">
            고객님께서 요청하신 페이지의 주소가 잘못 입력되었거나,<br />
            페이지의 주소가 변경 혹은 삭제되어 요청하신 페이지를 찾을 수 없습니다.<br />
            입력하신 주소가 정확한지 다시 한번 확인해 주시기 바랍니다.
          </p>
          <p class="error-page__contact">
            <span class="error-page__contact-label">문의 :</span>
            <a class="error-page__contact-tel" href="tel:1234-1234">1234-1234</a>
          </p>
        </div>

        <div class="error-page__actions">
          <a class="btn-cta btn-cta--l btn-cta--secondary" href="{{base}}">메인 페이지</a>
          <button class="btn-cta btn-cta--l btn-cta--primary" type="button" data-error-back>
            이전 화면
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
