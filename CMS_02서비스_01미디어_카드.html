<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doo'h CMS 미디어 관리 — 카드형" />
    <title>미디어 관리 | Doo'h CMS</title>
    {{> app-critical-styles}}
    <link rel="stylesheet" href="./src/styles/main.scss" />
    <link rel="stylesheet" href="./src/styles/pages/media-list.scss" />
    <script type="module" src="./src/js/media-card.js"></script>
  </head>
  <body class="app-page" data-active-menu="service" data-active-submenu-item="media">
    {{> app-header}}

    <div class="app-layout">
      {{> app-sidebar}}

      <main class="app-main">
        <header class="page-heading">
          <nav class="breadcrumb" aria-label="현재 위치">
            <a href="{{base}}CMS_02서비스_01미디어_목록.html">
              <img src="{{base}}assets/icons/home.svg" alt="" />
              서비스
            </a>
            <img src="{{base}}assets/icons/breadcrumb-arrow.svg" alt="" />
            <span>미디어</span>
          </nav>
          <h1>미디어</h1>
          <p class="page-heading__meta">
            <span>전체 <strong>9</strong> 개 미디어</span>
            <span class="page-heading__dot" aria-hidden="true"></span>
            <span>최근 업데이트26.05.05</span>
          </p>
        </header>

        <section class="media-content">
          {{> pages/media/filters}}
          <div class="media-toolbar">
            {{> pages/media/summary}}
            <div class="view-options" aria-label="보기 방식">
              <a class="view-option view-option--list" href="{{base}}CMS_02서비스_01미디어_목록.html">
                <span class="view-option__icon" aria-hidden="true"></span>
                <span>리스트</span>
              </a>
              <a class="view-option view-option--grid is-active" href="{{base}}CMS_02서비스_01미디어_카드.html">
                <span class="view-option__icon" aria-hidden="true"></span>
                <span>카드</span>
              </a>
            </div>
          </div>
          {{> pages/media/cards}}
        </section>
      </main>
    </div>
  </body>
</html>
