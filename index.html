<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doo'h CMS 개발 페이지 목록" />
    <title>페이지 목록 | Doo'h CMS - Admin</title>
    <link rel="stylesheet" href="./src/styles/pages/index.scss" />
    <script type="module" src="./src/js/pages/index.js"></script>
  </head>
  <body class="page-list">
    <main class="page-list__content link-page">
      <h1 class="link-page__title">2026 AF Doo'h CMS - Admin</h1>

      <div class="link-page__search">
        <input
          type="text"
          id="searchInput"
          class="link-page__search-input"
          placeholder="검색어를 입력하세요"
        />
        <button type="button" id="searchButton" class="link-page__search-btn">검색</button>
      </div>

      <table class="link-page__table">
        <thead>
          <tr>
            <th>파일</th>
            <th>페이지명</th>
            <th>비고</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          {{#each pages}}
          <tr>
            <td><a href="./{{name}}" target="_blank">{{name}}</a></td>
            <td>{{title}}</td>
            <td>{{note}}</td>
          </tr>
          {{/each}}
        </tbody>
      </table>
      <p class="link-page__no-results" id="noResults" hidden>검색 결과가 없습니다.</p>
    </main>
  </body>
</html>
