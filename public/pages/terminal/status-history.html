<article class="terminal-section">
  <div class="terminal-section__head">
    <div class="terminal-section__titles">
      <h2 class="terminal-section__title">상태 이력 · 시간대별 추이</h2>
      <p class="terminal-section__subtitle">최신 데이터 15건</p>
    </div>
    <button class="terminal-section__reset" type="button" aria-label="새로고침">
      <img src="{{base}}assets/icons/terminal/reset.svg" alt="" />
    </button>
  </div>

  <div class="status-chart-grid">
    <div class="status-chart">
      <div class="status-chart__head">
        <span class="status-chart__label">CPU 사용률</span>
        <strong class="status-chart__value">38%</strong>
      </div>
      <div class="status-chart__body">
        <img src="{{base}}assets/images/terminal/chart-cpu.png" alt="" />
      </div>
    </div>

    <div class="status-chart">
      <div class="status-chart__head">
        <span class="status-chart__label">RAM 사용률</span>
        <strong class="status-chart__value">54%</strong>
      </div>
      <div class="status-chart__body">
        <img src="{{base}}assets/images/terminal/chart-ram.png" alt="" />
      </div>
    </div>

    <div class="status-chart">
      <div class="status-chart__head">
        <span class="status-chart__label">배터리 잔량</span>
        <strong class="status-chart__value">97%</strong>
      </div>
      <div class="status-chart__body">
        <img src="{{base}}assets/images/terminal/chart-battery.png" alt="" />
      </div>
    </div>

    <div class="status-chart">
      <div class="status-chart__head">
        <span class="status-chart__label">배터리 온도</span>
        <strong class="status-chart__value">31°C</strong>
      </div>
      <div class="status-chart__body">
        <img src="{{base}}assets/images/terminal/chart-temp.png" alt="" />
      </div>
    </div>
  </div>
</article>
