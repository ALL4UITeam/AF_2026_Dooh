<!-- 선택 미디어 요약 -->
<article class="monitoring-summary">
  <div class="monitoring-summary__icon" aria-hidden="true">
    <img src="{{base}}assets/icons/monitoring/device.svg" alt="" />
  </div>

  <div class="monitoring-summary__body">
    <div class="monitoring-summary__identity">
      <div class="monitoring-summary__title-row">
        <span class="monitoring-summary__badge">MAIN</span>
        <h2 class="monitoring-summary__name">광화문역_미디어1</h2>
      </div>
      <p class="monitoring-summary__location">서울특별시 대한민국</p>
    </div>

    <div class="monitoring-summary__divider" aria-hidden="true"></div>

    <div class="monitoring-summary__meta">
      <div class="data-box">
        <span class="data-box__label">운영시간</span>
        <span class="data-box__value">매일 00:00–24:00</span>
      </div>
      <div class="data-box">
        <span class="data-box__label">활성시간</span>
        <span class="data-box__value">매일 00:00–24:00</span>
      </div>
    </div>

    <span class="badge-state badge-state--error badge-state--l">
      <span class="badge-state__dot" aria-hidden="true"></span>
      장애
    </span>

    <div class="monitoring-summary__actions">
      <div class="monitoring-summary__divider" aria-hidden="true"></div>
      <button type="button" class="btn-text btn-text--m monitoring-summary__reboot">
        <img src="{{base}}assets/icons/monitoring/reboot.svg" alt="" />
        재부팅
      </button>
    </div>
  </div>
</article>
