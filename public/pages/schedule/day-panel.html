<!-- 선택일 스케줄 패널 -->
<aside class="schedule-panel" aria-labelledby="schedule-panel-title">
  <header class="schedule-panel__header">
    <h2 class="schedule-panel__title" id="schedule-panel-title" data-schedule-title>6월 29일 스케줄</h2>
    <p class="schedule-panel__count" data-schedule-count>6개 스케줄</p>
  </header>

  <div class="schedule-panel__body">
    <section class="schedule-chart" aria-label="광고 유형 분포">
      <h3 class="schedule-chart__title">광고 유형 분포</h3>
      <div class="schedule-chart__bar" role="img" aria-label="상업 33%, 공익 50%, 자사 17%">
        <span class="schedule-chart__seg schedule-chart__seg--commercial" style="flex:70%"></span>
        <span class="schedule-chart__seg schedule-chart__seg--public" style="flex:20%"></span>
        <span class="schedule-chart__seg schedule-chart__seg--internal" style="flex:10%"></span>
      </div>
      <ul class="schedule-chart__legend">
        <li class="schedule-chart__legend-item">
          <span class="schedule-chart__legend-label">
            <img src="{{base}}assets/icons/schedule/dot-commercial.svg" alt="" />
            상업
          </span>
          <strong class="schedule-chart__legend-value">33<span>%</span></strong>
        </li>
        <li class="schedule-chart__legend-item">
          <span class="schedule-chart__legend-label">
            <img src="{{base}}assets/icons/schedule/dot-public.svg" alt="" />
            공익
          </span>
          <strong class="schedule-chart__legend-value">50<span>%</span></strong>
        </li>
        <li class="schedule-chart__legend-item">
          <span class="schedule-chart__legend-label">
            <img src="{{base}}assets/icons/schedule/dot-internal.svg" alt="" />
            자사
          </span>
          <strong class="schedule-chart__legend-value">17<span>%</span></strong>
        </li>
      </ul>
    </section>

    <div class="schedule-list" data-schedule-list>
      <article class="schedule-card">
        <header class="schedule-card__header">
          <h3 class="schedule-card__title">나이키 6월 캠페인</h3>
          <span class="badge-state badge-state--info">
            <span class="badge-state__dot" aria-hidden="true"></span>
            확정
          </span>
        </header>
        <dl class="schedule-card__meta">
          <div class="schedule-card__row">
            <dt>프로덕트</dt>
            <dd>강남 A지구 패키지</dd>
          </div>
          <div class="schedule-card__row">
            <dt>프리이플랜</dt>
            <dd>가-2</dd>
          </div>
          <div class="schedule-card__row">
            <dt>광고 유형</dt>
            <dd>상업 광고</dd>
          </div>
          <div class="schedule-card__row">
            <dt>재생 시간</dt>
            <dd>30초</dd>
          </div>
          <div class="schedule-card__row">
            <dt>스케줄 유형</dt>
            <dd>일반</dd>
          </div>
          <div class="schedule-card__row">
            <dt>광고 기관</dt>
            <dd>2026-06-01 ~ 06-30</dd>
          </div>
          <div class="schedule-card__row">
            <dt>광고주</dt>
            <dd>나이키코리아</dd>
          </div>
        </dl>
      </article>

      <article class="schedule-card">
        <header class="schedule-card__header">
          <h3 class="schedule-card__title">LG 가전 캠페인</h3>
          <span class="badge-state badge-state--pending">
            <span class="badge-state__dot" aria-hidden="true"></span>
            예약
          </span>
        </header>
        <dl class="schedule-card__meta">
          <div class="schedule-card__row">
            <dt>프로덕트</dt>
            <dd>강남 A지구 패키지</dd>
          </div>
          <div class="schedule-card__row">
            <dt>프리이플랜</dt>
            <dd>가-2</dd>
          </div>
          <div class="schedule-card__row">
            <dt>광고 유형</dt>
            <dd>상업 광고</dd>
          </div>
          <div class="schedule-card__row">
            <dt>재생 시간</dt>
            <dd>30초</dd>
          </div>
          <div class="schedule-card__row">
            <dt>스케줄 유형</dt>
            <dd>일반</dd>
          </div>
          <div class="schedule-card__row">
            <dt>광고 기관</dt>
            <dd>2026-06-01 ~ 06-30</dd>
          </div>
          <div class="schedule-card__row">
            <dt>광고주</dt>
            <dd>나이키코리아</dd>
          </div>
        </dl>
      </article>
    </div>
  </div>
</aside>
