<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doo'h CMS 프로덕트 등록 — 미디어 선택 검토 모달" />
    <title>프로덕트 등록 · 미디어 선택 검토 | Doo'h CMS</title>
    {{> app-critical-styles}}
    <link rel="stylesheet" href="./src/styles/main.scss" />
    <link rel="stylesheet" href="./src/styles/pages/media-list.scss" />
    <link rel="stylesheet" href="./src/styles/pages/media-register.scss" />
    <link rel="stylesheet" href="./src/styles/pages/product-register.scss" />
    <script type="module" src="./src/js/product-register.js"></script>
  </head>
  <body
    class="app-page"
    data-active-menu="operation"
    data-active-submenu-item="product"
    data-open-modal="media-select-review-modal"
  >
    {{> app-header}}

    <div class="app-layout">
      {{> app-sidebar}}

      <main class="app-main app-main--register">
        <header class="page-heading">
          <nav class="breadcrumb" aria-label="현재 위치">
            <a href="{{base}}CMS_02운영_01프로덕트_목록.html">
              <img src="{{base}}assets/icons/home.svg" alt="" />
              운영
            </a>
            <img src="{{base}}assets/icons/breadcrumb-arrow.svg" alt="" />
            <a href="{{base}}CMS_02운영_01프로덕트_목록.html">프로덕트 관리</a>
          </nav>
          <h1>프로덕트 등록</h1>
        </header>

        <section class="product-register">
          {{> pages/product/register-form-selected}}
        </section>
      </main>
    </div>

    {{> pages/product/media-select-review-modal}}
  </body>
</html>
