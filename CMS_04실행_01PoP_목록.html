<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doo'h CMS PoP 및 결과 확인" />
    <title>PoP 및 결과 확인 | Doo'h CMS</title>
    {{> app-critical-styles}}
    <link rel="stylesheet" href="./src/styles/main.scss" />
    <link rel="stylesheet" href="./src/styles/pages/media-list.scss" />
    <link rel="stylesheet" href="./src/styles/pages/pop-list.scss" />
    <script type="module" src="./src/js/pop.js"></script>
  </head>
  <body class="app-page" data-active-menu="execution" data-active-submenu-item="pop">
    {{> app-header}}

    <div class="app-layout">
      {{> app-sidebar}}

      <main class="app-main">
        <header class="page-heading page-heading--with-stat">
          <div class="page-heading__body">
            <nav class="breadcrumb" aria-label="현재 위치">
              <a href="{{base}}CMS_04실행_01PoP_목록.html">
                <img src="{{base}}assets/icons/home.svg" alt="" />
                실행
              </a>
              <img src="{{base}}assets/icons/breadcrumb-arrow.svg" alt="" />
              <span>PoP 및 결과 확인</span>
            </nav>
            <h1>PoP 및 결과 확인</h1>
            <p class="page-heading__meta">
              <span>전체 <strong>142</strong> 개 프로덕트</span>
              <span class="page-heading__dot" aria-hidden="true"></span>
              <span>최근 업데이트26.05.05</span>
            </p>
          </div>
          <div class="page-heading__stat" aria-label="평균 달성률">
            <span class="page-heading__stat-label">평균 달성률</span>
            <strong class="page-heading__stat-value">95.3%</strong>
          </div>
        </header>

        <section class="media-content">
          {{> pages/pop/filters}}
          {{> pages/pop/summary}}
          {{> pages/pop/table}}
        </section>
      </main>
    </div>

    {{> pages/pop/report-modal}}
  </body>
</html>
